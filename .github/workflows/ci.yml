name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install R and audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base r-cran-jsonlite ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify native prerequisites
        run: |
          Rscript -e 'stopifnot(requireNamespace("jsonlite", quietly=TRUE))'
          ffmpeg -v error -f lavfi -i sine=frequency=440:duration=0.1 -c:a libopus -f ogg -y /tmp/ci-audio.ogg
          ffmpeg -v error -f lavfi -i sine=frequency=440:duration=0.1 -c:a libmp3lame -f mp3 -y /tmp/ci-audio.mp3
      - name: Run backend tests
        run: python -m pytest -q -ra

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint, type-check and build
        run: npm run build